<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Harold Street Display</title>
<meta name="description" content="Household display: energy prices, home, travel, a screensaver and a night clock, for a wall tablet, phone or TV.">
<meta name="theme-color" content="#04050d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Display">
<link rel="manifest" href="display.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2304050d'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%234fd6ff' stroke-width='3'/%3E%3Cpath d='M35 14 24 35h9l-4 15 12-22h-9z' fill='%23ffb547'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Exo+2:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Doto:wght@700;800&display=swap">
<style>
/* Household display, in the dashboard's look (src/styles/app.css) at ten-foot sizes. On a 1080p TV the root font is
   about 27px and nothing is smaller than 0.9rem (24px); focus rings are loud; every action works with arrows and Enter;
   a safe margin keeps clear of TV overscan. Written for older TV browsers (Chromium 63+): no inset, no flex gap
   (grid-gap for grids), no :focus-visible, and clamp() or min() only after a fallback. */
:root{
  --void:#04050d; --card:rgba(14,18,40,.72); --card-2:rgba(8,10,26,.6); --surface:rgba(14,18,40,.74); --surface-2:rgba(4,5,13,.6);
  --ink:#e9ecff; --muted:#9aa2c8; --faint:#6c7399; --line:rgba(134,152,255,.14); --line-hot:rgba(134,152,255,.34);
  --elec:#ffb547; --gas:#4fd6ff; --neg:#b892ff; --cal:#ff7ad9; --nebula:#8f6bff; --nebula-2:#ff5fae;
  --cheap:#46e6a1; --normal:#ffd166; --peak:#ff6b7d; --good:#46e6a1; --warn:#ffd166; --bad:#ff6b7d;
  --radius:.55rem; --radius-sm:.35rem;
  --f-display:"Syncopate","Eurostile","Arial Black",ui-sans-serif,sans-serif;
  --f-body:"Exo 2",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --edge-x:16px; --edge-y:14px;
  color-scheme:dark;
}
:root[data-corners="sharp"]{--radius:.15rem;--radius-sm:.1rem}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:16px}
/* TV and big screens: scale with the screen, about 27px at 1920 x 1080, and keep 4.5% clear for overscan. */
@media (min-width:1144px){
  html{font-size:1.4vw;font-size:min(1.4vw,2.5vh)}
  :root{--edge-x:4.5vw;--edge-y:4.5vh}
}
body{margin:0;color:var(--ink);font:1rem/1.4 var(--f-body);background-color:var(--void);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(60vw 45vw at 88% -8%, rgba(143,107,255,.12), transparent 70%),radial-gradient(50vw 40vw at -10% 35%, rgba(79,214,255,.06), transparent 70%)}
[hidden]{display:none!important}
#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block;transition:opacity 2s;opacity:.7}
a{color:var(--gas)}
p{margin:0}
h1,h2,h3{margin:0;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.cheap,.good{color:var(--cheap)} .normal,.warn{color:var(--normal)} .peak,.bad{color:var(--peak)} .neg{color:var(--neg)} .elec{color:var(--elec)} .gas{color:var(--gas)}
.label{font:500 .9rem/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.title{font:700 1.4rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase}

/* the screen */
.screen{position:relative;z-index:1;min-height:100vh;padding:calc(var(--edge-y) + env(safe-area-inset-top,0px)) calc(var(--edge-x) + env(safe-area-inset-right,0px)) calc(var(--edge-y) + env(safe-area-inset-bottom,0px)) calc(var(--edge-x) + env(safe-area-inset-left,0px));display:flex;flex-direction:column}
.mode{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
.mode:not(.mode-saver) > * + *{margin-top:.6rem}
.foot{margin-top:auto!important;padding-top:.6rem;font:500 .9rem/1.4 var(--f-mono);color:var(--faint);display:flex;flex-wrap:wrap;justify-content:space-between}
.foot > *{margin-right:1.2rem}
.foot .warn{color:var(--warn)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.65rem .95rem;min-width:0}
.card > .label{margin-bottom:.4rem}
.card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.3rem}
.card-head .aside{font:500 .9rem/1.3 var(--f-mono);color:var(--cheap)}
.grid3,.grid2{display:grid;grid-template-columns:1fr;grid-gap:.75rem;gap:.75rem}
@media (min-width:900px){ .grid3{grid-template-columns:1.15fr 1fr 1fr} .grid2{grid-template-columns:1fr 1fr} }
.rows{margin:0;padding:0;list-style:none}
.rows li{display:flex;align-items:center;justify-content:space-between;padding:.3rem 0;border-top:1px solid var(--line);min-width:0}
.rows li:first-child{border-top:0;padding-top:0}
.rows .main{min-width:0;flex:1 1 auto;margin-right:.6rem}
.rows .main b{font-weight:600}
.rows .sub{display:block;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .side{font:500 1rem/1.3 var(--f-mono);text-align:right;white-space:nowrap}
.rows .side .sub{font:400 .9rem/1.3 var(--f-body)}
.rows .side .sub.late{color:var(--warn)}
.empty,.note{font-size:.9rem;color:var(--muted)}
.dots{display:inline-flex;margin-left:.6rem}
.dots.lead{margin:0 .6rem 0 0}
.dots i{width:.9rem;height:.9rem;border-radius:50%;border:1px solid rgba(255,255,255,.25);margin-left:.25rem;display:inline-block}
.legend{display:flex;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin-top:.4rem}
.legend span{margin-right:1rem;display:inline-flex;align-items:center}
.legend i{width:.7rem;height:.7rem;border-radius:.2rem;display:inline-block;margin-right:.4rem}
.mix{display:flex;height:.45rem;border-radius:.25rem;overflow:hidden;margin-top:.6rem}
.mix i{display:block;min-width:2px;margin-right:2px}
.stat{display:flex;align-items:baseline;justify-content:space-between;padding:.3rem 0;border-top:1px solid var(--line)}
.stat:first-child{border-top:0;padding-top:0}
.stat .v{font:500 1.2rem/1.2 var(--f-mono);white-space:nowrap}
.stat .v .small{font:500 1rem/1.2 var(--f-body)}
.stat .k{font-size:.9rem;color:var(--muted);margin-right:.8rem}

/* the top of a view: clock, answer, weather */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between}
.top.slim{align-items:baseline}
.when .clock{font:500 3.8rem/1 var(--f-mono);letter-spacing:.02em}
.clock.sm{font:500 1.6rem/1 var(--f-mono)}
.date{font-size:1.05rem;color:var(--muted);margin-top:.3rem}
.verdict{flex:1 1 18rem;margin:0 1.5rem;min-width:0}
.verdict .big{font:700 2rem/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin:0}
.verdict.big .big{font-size:2.6rem}
.verdict .line{font-size:1.2rem;margin-top:.35rem}
.verdict .note{margin-top:.2rem}
.glow-cheap{color:var(--cheap);text-shadow:0 0 1.2rem rgba(70,230,161,.45)} .glow-normal{color:var(--normal);text-shadow:0 0 1.2rem rgba(255,209,102,.4)}
.glow-peak{color:var(--peak);text-shadow:0 0 1.2rem rgba(255,107,125,.45)} .glow-neg{color:var(--neg);text-shadow:0 0 1.2rem rgba(184,146,255,.5)}
.wx{display:flex;align-items:center;text-align:right}
.wx .i{font-size:2.6rem;line-height:1;margin-right:.6rem}
.wx .t{font:500 3rem/1 var(--f-mono)}
.wx .d{font-size:.95rem;color:var(--muted);margin-left:.8rem;text-align:left}
.price-now{text-align:right}
.price-now .label{display:block}
.price{display:block;font:500 4.4rem/1 var(--f-mono);letter-spacing:-.02em}
.price-now .sub{display:block;font-size:1rem;color:var(--muted);margin-top:.3rem}

/* heads-ups */
.heads{display:flex;flex-wrap:wrap;margin:0 -.375rem}
.heads:empty{display:none}
.hu{flex:1 1 18rem;margin:.375rem;display:flex;align-items:center;padding:.45rem .9rem;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);border-left:.22rem solid currentColor;min-width:0}
.hu .ic{width:1.6rem;height:1.6rem;flex:none;margin-right:.8rem;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hu .t{color:var(--ink);min-width:0}
.hu b{display:block;font-weight:600;font-size:1.15rem}
.hu .s{display:block;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hu .dots{margin-left:auto}

/* the price strip */
.strip{position:relative;height:7rem;margin:0 -.2rem}
.strip-card.tall .strip{height:10.6rem}
.strip svg{display:block}
.strip .lbl{fill:var(--muted);font-family:var(--f-mono)}
.strip .lbl.cheap{fill:var(--cheap)} .strip .lbl.rain{fill:var(--gas)} .strip .lbl.now{fill:var(--ink)}
.strip .cheapb{fill:rgba(70,230,161,.1)} .strip .rainb{fill:rgba(79,214,255,.08)}
.strip .nowl{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.7}
.strip .nowd{fill:var(--ink)}
.strip .zero{stroke:var(--neg);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.strip .mk{stroke:var(--line-hot);stroke-width:1.5}
.strip .mkt{fill:var(--gas)} .strip .mke{fill:var(--cal)}

/* departures */
.deps{width:100%;border-collapse:collapse;font-size:1.1rem}
.deps th{font:500 .9rem/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:0 .6rem .4rem 0;font-weight:500}
.deps td{padding:.4rem .6rem .4rem 0;border-top:1px solid var(--line);vertical-align:baseline}
.deps .t{font-family:var(--f-mono);white-space:nowrap}
.deps .dest{width:100%}
.deps .sub{display:block;font-size:.9rem;color:var(--muted)}
.deps .sub .warn{color:var(--warn)} .deps .sub .bad{color:var(--bad)}
.deps tr.gone td{opacity:.45}
.deps .lv{text-align:right;white-space:nowrap;font-family:var(--f-mono);padding-right:0}
@media (max-width:520px){.deps .opt{display:none}}
/* the trains as the station shows them: orange dot-matrix on black (Doto; the mono font if it hasn't loaded). Doto is monospaced, so columns in ch line up */
.dmx{position:relative;background:#050403;border:2px solid #1d1a16;border-radius:var(--radius-sm);padding:.45rem .8rem .55rem;margin-top:.5rem;overflow:hidden;
  font:800 1.1rem/1.35 "Doto",var(--f-mono);color:#ffa31a;text-shadow:0 0 .35rem rgba(255,150,0,.55);box-shadow:inset 0 0 1.2rem rgba(0,0,0,.9)}
.dmx:after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;background-image:radial-gradient(rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 56%);background-size:3px 3px}
body.lite .dmx{text-shadow:none}
.dmx .row{display:grid;grid-column-gap:1ch;column-gap:1ch;align-items:baseline;white-space:nowrap;min-width:0}
.deps-sign .row{grid-template-columns:5ch minmax(0,1fr) 4ch 9ch 8ch}
.plat-sign .row{grid-template-columns:3ch 5ch minmax(0,1fr) auto}
.dmx .d{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dmx .p{text-align:center}
.dmx .s,.dmx .g{text-align:right}
.dmx .hdr{opacity:.75}
.dmx .dim{opacity:.4}
.dmx .row.centre{display:block;text-align:center}
.dmx .row.calls{display:block;overflow:hidden}
.dmx .run{display:inline-block;padding-left:100%;animation:dmxrun linear infinite}
@keyframes dmxrun{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.dmx .blink{animation:dmxblink 1s steps(2,start) infinite}
@keyframes dmxblink{to{visibility:hidden}}
.dmx .clock-s{text-align:center;font-size:1.5rem;line-height:1.25;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){.dmx .row.calls{white-space:normal}.dmx .run{display:inline;padding-left:0;animation:none}.dmx .blink{animation:none}}
.travel .solo{grid-column:1/-1}
@media (min-width:900px){ .travel .solo .dmx{font-size:1.3rem} .travel .solo .dmx .clock-s{font-size:2rem} }

@media (max-width:520px){.dmx{font-size:.95rem}.deps-sign .row{grid-template-columns:5ch minmax(0,1fr) 3ch 9ch}.deps-sign .g{display:none}.travel .solo .dmx{font-size:.95rem}}

/* toolbar: hidden until a key, tap or mouse move, then fades after a few seconds */
.bar{position:fixed;z-index:20;top:0;left:0;right:0;padding:calc(var(--edge-y) * .6 + env(safe-area-inset-top,0px)) var(--edge-x) .7rem;background:rgba(4,5,13,.96);border-bottom:1px solid var(--line-hot);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;transform:translateY(-110%);opacity:0;transition:transform .3s,opacity .3s;visibility:hidden}
.chrome-on .bar{transform:none;opacity:1;visibility:visible}
.picker,.bar-actions{display:flex;flex-wrap:wrap;align-items:center}
.picker{overflow-x:auto;max-width:100%;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.btn{font:500 .9rem/1 var(--f-body);color:var(--ink);background:var(--card-2);border:2px solid var(--line-hot);border-radius:var(--radius-sm);padding:.65em 1em;margin:.2rem .5rem .2rem 0;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn[aria-selected="true"],.btn.primary{background:var(--gas);border-color:var(--gas);color:#04101a;font-weight:600}
.btn .k{opacity:.55;margin-right:.45em;font-family:var(--f-mono)}
.btn:focus,select:focus,input:focus{outline:4px solid var(--elec);outline-offset:3px;box-shadow:0 0 26px -2px var(--elec)}
.btn::-moz-focus-inner{border:0}
.bar .btn{padding:.65em .75em;margin-right:.35rem}      /* six views and four actions on one row at 1080p */

/* screensaver: a side window onto space. Space and billboards outside, then close things, the glass, the frame and the cabin. */
.mode-saver{position:fixed;top:0;left:0;right:0;bottom:0;z-index:5;overflow:hidden;background:#02030a;--amb:126,146,255}
body.cockpit #stars{opacity:0}
#cSpace,#cAhead,#cNear,#cGlass,#cFrame{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
#cBoards{position:absolute;z-index:1;top:0;left:0;width:100%;height:100%;overflow:hidden;perspective:1200px}
#cNear{z-index:2}
.cockpit #stars{display:none}
#cNear.idle{display:none}
#cShip{position:absolute;z-index:3;top:-2%;left:-2%;width:104%;height:104%;will-change:transform}
#cFrame .rim{stroke:rgba(var(--amb),.75);filter:drop-shadow(0 0 6px rgba(var(--amb),.8))}
/* lite: the TV's lighter touch, with no blurred shadows or looping effects for its browser to keep repainting */
.lite #cFrame .rim,.lite .dial .needle path{filter:none}
.lite .board .holo,.lite .board .holo::after,.lite .board .buoy::after,.lite .leds i,.lite .hud .lamp.bad{animation:none}
.lite .board .holo::after{display:none}
.lite .board .holo{box-shadow:0 0 0 1px rgba(var(--rgb),.25)}
.lite .board .bb,.lite .strain .cpanel .bb,.lite .hud .v,.lite .hud .hclock{text-shadow:none}
#cFrame .bolts{stroke:rgba(var(--amb),.3)}

/* billboards: a hologram above a little beacon, projected up in a cone of light */
.tone-good{--rgb:70,230,161} .tone-warn{--rgb:255,209,102} .tone-bad{--rgb:255,107,125} .tone-neg{--rgb:184,146,255}
.tone-cyan{--rgb:79,214,255} .tone-violet{--rgb:143,107,255} .tone-muted{--rgb:150,166,255}
.board{position:absolute;top:0;left:0;width:23rem;transform-origin:50% 50%;will-change:transform;backface-visibility:hidden}
.board .holo{position:relative;padding:.85rem 1.2rem 1rem;border-radius:.5rem;overflow:hidden;color:var(--ink);
  background:linear-gradient(180deg,rgba(var(--rgb),.24),rgba(var(--rgb),.06) 55%,rgba(var(--rgb),.16)),rgba(5,7,20,.62);
  border:1px solid rgba(var(--rgb),.6);box-shadow:0 0 0 1px rgba(var(--rgb),.12),0 0 46px -6px rgba(var(--rgb),.75),inset 0 0 32px -8px rgba(var(--rgb),.5);animation:holo 7s infinite}
.board .holo::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 1px,transparent 1px,transparent 3px)}
.board .holo::after{content:"";position:absolute;top:-60%;bottom:-60%;left:-45%;width:30%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-20deg);animation:sweep 8s ease-in-out infinite}
.board .beam{position:absolute;left:50%;top:100%;width:12rem;height:3.6rem;margin-left:-6rem;background:linear-gradient(rgba(var(--rgb),.3),rgba(var(--rgb),0));-webkit-clip-path:polygon(0 0,100% 0,56% 100%,44% 100%);clip-path:polygon(0 0,100% 0,56% 100%,44% 100%)}
.board .buoy{position:absolute;left:50%;top:100%;margin:3.3rem 0 0 -1.5rem;width:3rem;height:1rem;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,rgba(var(--rgb),.7),#2a3060 55%,#0c0f24 85%);box-shadow:0 0 18px 0 rgba(var(--rgb),.8)}
.board .buoy::after{content:"";position:absolute;left:50%;top:-.4rem;width:.55rem;height:.55rem;margin-left:-.275rem;border-radius:50%;background:rgb(var(--rgb));box-shadow:0 0 14px rgb(var(--rgb));animation:pulse 1.8s ease-in-out infinite}
.board .bh,.strain .bh{display:block;font:500 .95rem/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:rgb(var(--rgb))}
.board .bh::before{content:"\25B8 ";opacity:.7}
.board .bb{display:block;font:700 2.5rem/1.15 var(--f-mono);font-variant-numeric:tabular-nums;margin:.2rem 0;text-shadow:0 0 20px rgba(var(--rgb),.85);overflow-wrap:anywhere}
.board .bs{display:block;font:500 1.05rem/1.35 var(--f-body);color:#c4cbef}
.board.long .bb{font-size:2rem}
/* music on a billboard: the cover beside the song, or the album wall, six covers from your shelf */
.board.has-img{width:31rem}
.board.has-img .holo{display:flex;align-items:center}
.board .art{flex:none;width:7.5rem;height:7.5rem;margin-right:1.1rem;border-radius:.3rem;overflow:hidden;box-shadow:0 0 1.6rem -.3rem rgba(var(--rgb),.9)}
.board .art img,.board .wall img{display:block;width:100%;height:100%;object-fit:cover}
.board .tx{flex:1 1 auto;min-width:0}
.board.has-img .bb,.board.has-wall .bb{font:700 1.75rem/1.2 var(--f-body);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.board.has-wall{width:26rem}
.board .wall{display:grid;grid-template-columns:7.4rem 7.4rem 7.4rem;grid-template-rows:7.4rem 7.4rem;grid-gap:.4rem;margin:.55rem 0 .45rem}
.board .wall span{display:block;border-radius:.25rem;overflow:hidden;box-shadow:0 0 1rem -.3rem rgba(var(--rgb),.8)}
@keyframes holo{0%,100%{opacity:1}46%{opacity:1}47%{opacity:.82}48%{opacity:1}74%{opacity:.94}75%{opacity:1}}
@keyframes sweep{0%,55%{left:-45%}100%{left:145%}}
@keyframes pulse{50%{opacity:.3}}

/* the space train: a sleek maglev, one fact on each carriage */
.strain{position:absolute;top:0;left:0;display:flex;align-items:flex-end;white-space:nowrap;transform-origin:0 0;will-change:transform}
.strain .loco,.strain .car{position:relative;flex:none;height:10.5rem;margin-right:.5rem;background:linear-gradient(180deg,#46508a 0%,#20264a 38%,#0d1028 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -6px 12px rgba(0,0,0,.5)}
.strain .loco{width:21rem;border-radius:10rem 1.2rem 1.2rem 7rem/6.5rem 1.2rem 1.2rem 4rem}
.strain .car{width:26rem;border-radius:1.2rem}
.strain .loco::after,.strain .car::after{content:"";position:absolute;left:1rem;right:0;bottom:1.1rem;height:.32rem;background:linear-gradient(90deg,#4fd6ff,#8f6bff);box-shadow:0 0 12px rgba(79,214,255,.8)}
.strain .car::after{left:0;background:rgb(var(--rgb));box-shadow:0 0 12px rgba(var(--rgb),.9)}
.strain .nose{position:absolute;left:2rem;top:1.4rem;width:8rem;height:2.8rem;border-radius:5rem 1rem .6rem 3rem;background:linear-gradient(135deg,#bff0ff,#2e74ae 60%,#163a63);box-shadow:inset 0 0 10px rgba(255,255,255,.4)}
.strain .lamp{position:absolute;left:.7rem;top:5.4rem;width:.9rem;height:.9rem;border-radius:50%;background:#fff;box-shadow:0 0 26px 9px rgba(255,240,200,.75)}
.strain .lname{position:absolute;right:1.4rem;top:5.2rem;font:500 .95rem/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--elec);text-shadow:0 0 10px rgba(255,181,71,.6)}
.strain .cwin{position:absolute;top:.8rem;left:1.3rem;right:1.3rem;height:1.3rem;border-radius:.35rem;background:repeating-linear-gradient(90deg,rgba(255,214,140,.9) 0,rgba(255,214,140,.9) 2.4rem,transparent 2.4rem,transparent 3.2rem);box-shadow:0 0 14px -2px rgba(255,214,140,.5)}
.strain .cpanel{position:absolute;left:1.1rem;right:1.1rem;top:2.6rem;bottom:1.9rem;padding:.4rem .8rem;border-radius:.45rem;overflow:hidden;background:rgba(3,5,16,.88);border:1px solid rgba(var(--rgb),.65);box-shadow:inset 0 0 22px -6px rgba(var(--rgb),.7)}
.strain .cpanel .bh{font-size:1.1rem;letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis}
.strain .cpanel .bb{display:block;font:700 2.2rem/1.15 var(--f-mono);color:var(--ink);text-shadow:0 0 16px rgba(var(--rgb),.85);overflow:hidden;text-overflow:ellipsis}
.strain .cpanel .bs{display:block;font:500 1.1rem/1.3 var(--f-body);color:#c4cbef;overflow:hidden;text-overflow:ellipsis}
.strain .bogie{position:absolute;left:2.4rem;right:2.4rem;bottom:-.7rem;height:.8rem;border-radius:.4rem;background:linear-gradient(#1c2040,#05060f);box-shadow:0 .5rem 1.2rem rgba(79,214,255,.55)}

.hud{position:absolute;left:8%;right:8%;bottom:4.5%;display:grid;grid-template-columns:1fr 11rem auto 11rem 1fr;grid-gap:1.5rem;gap:1.5rem;align-items:end;text-align:left}
.hud .g{display:flex;flex-direction:column;min-width:0}
.hud .g.c{align-items:center;text-align:center}
.hud .g.r{align-items:flex-end;text-align:right}
.hud .k{font:500 .9rem/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.16em;color:var(--gas)}
.hud .v{font:500 2.1rem/1.15 var(--f-mono);font-variant-numeric:tabular-nums;text-shadow:0 0 14px currentColor}
.hud .s{font:500 .9rem/1.3 var(--f-mono);color:var(--muted)}
.hud .hclock{font:500 3.4rem/1 var(--f-mono);letter-spacing:.04em;text-shadow:0 0 24px rgba(143,107,255,.7)}
.hud .muted{color:var(--muted)}
.hud .inst[data-off]{visibility:hidden}
.hud .inst{align-items:center;text-align:center}
.hud .dial{display:block;width:7.5rem;height:4.05rem;overflow:visible}
.dial .arc{fill:none;stroke:rgba(134,152,255,.18);stroke-width:14}
.dial .band{fill:none;stroke-width:5;opacity:.85}
.dial .band.good{stroke:var(--good)} .dial .band.warn{stroke:var(--elec)} .dial .band.bad{stroke:var(--bad)}
.dial .needle{transform-origin:100px 100px;transition:transform 1.2s cubic-bezier(.3,1.5,.5,1)}
.dial .needle path{fill:#f4f6ff;filter:drop-shadow(0 0 4px rgba(255,255,255,.8))}
.dial circle{fill:#20264a;stroke:rgba(134,152,255,.6);stroke-width:2}
.hud .iv{font-weight:700;color:var(--ink)}
.hud .fuel{position:relative;display:block;width:9rem;height:.8rem;margin:.35rem 0 .3rem;border-radius:.4rem;background:rgba(134,152,255,.14);box-shadow:inset 0 0 0 1px rgba(134,152,255,.3)}
.hud .fuel .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:.4rem;background:var(--good);box-shadow:0 0 10px var(--good);transition:width 1.2s}
.hud .fuel.bad .fill{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.hud .fuel .mark{position:absolute;top:-.3rem;bottom:-.3rem;width:2px;margin-left:-1px;background:#f4f6ff;box-shadow:0 0 6px #fff}
.hud .fuel.nousual{display:none}
.hud .air{display:flex;align-items:center;justify-content:center;margin-top:.2rem}
.hud .lamp{flex:none;width:.8rem;height:.8rem;margin-right:.45rem;border-radius:50%;background:var(--muted)}
.hud .lamp.good{background:var(--good);box-shadow:0 0 10px 2px var(--good)} .hud .lamp.warn{background:var(--elec);box-shadow:0 0 10px 2px var(--elec)}
.hud .lamp.bad{background:var(--bad);box-shadow:0 0 10px 2px var(--bad);animation:pulse 1.6s ease-in-out infinite}
.leds{position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);display:flex}
.leds i{width:.5rem;height:.5rem;border-radius:50%;margin:0 .45rem;background:var(--gas);box-shadow:0 0 10px var(--gas);animation:pulse 2.2s ease-in-out infinite}
.leds i:nth-child(2){animation-delay:.4s;background:var(--elec);box-shadow:0 0 10px var(--elec)} .leds i:nth-child(3){animation-delay:.8s} .leds i:nth-child(4){animation-delay:1.2s;background:var(--good);box-shadow:0 0 10px var(--good)} .leds i:nth-child(5){animation-delay:1.6s}
.hud[data-engine="eco"] ~ .leds i{background:var(--bad);box-shadow:0 0 10px var(--bad);animation-duration:3.4s}
.hud[data-engine="warp"] ~ .leds i{background:var(--neg);box-shadow:0 0 12px var(--neg);animation-duration:.6s}
.flash{position:absolute;z-index:4;top:0;left:0;right:0;bottom:0;background:#dfe6ff;opacity:0;pointer-events:none}

/* night: very dim, black background, slow drift so nothing burns in */
body.night{background:#000}
body.night #stars{opacity:.12}
.night-wrap{margin:auto;text-align:center;animation:drift 420s ease-in-out infinite alternate;color:#4a4f6a}
.night-clock{font:500 22vw/1 var(--f-mono);letter-spacing:.02em}
@media (min-width:700px){.night-clock{font-size:8rem}}
.night-sub{font:500 1.1rem/1.5 var(--f-mono);margin-top:.6rem}

/* music: the cover, the song and its words, over the cover's own colours blurred into a nebula. Lyrics and liner
   notes are views of the same screen, chosen with the down arrow. */
.music-mode{position:relative}
.msky{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;pointer-events:none}
.msky img{position:absolute;top:-15%;left:-15%;width:130%;height:130%;object-fit:cover;opacity:.42;filter:blur(48px) saturate(1.4);transition:opacity 1.2s}
.msky img:not([src]){opacity:0}
.msky::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,rgba(4,5,13,.25),rgba(4,5,13,.72) 62%),linear-gradient(0deg,rgba(4,5,13,.85),rgba(4,5,13,0) 45%)}
.lite .msky img{filter:none;opacity:.25}
.music-mode > .m-empty{margin:auto;max-width:56rem;text-align:center}
.mwall{display:flex;justify-content:center;margin-top:2.2rem}
.mwall img{width:7rem;height:7rem;margin:0 .3rem;border-radius:var(--radius-sm);object-fit:cover;box-shadow:0 .8rem 2rem rgba(0,0,0,.5);opacity:.85}
.m-empty .big{font:700 2.2rem/1.15 var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin:.5rem 0 .6rem}
.m-empty .note{font-size:1.1rem;line-height:1.5}
.m-empty .note b{color:var(--gas);font-weight:600}
.favs{list-style:none;margin:1.6rem auto 0;padding:0;display:inline-grid;grid-template-columns:1fr 1fr;grid-gap:.5rem 2.4rem;text-align:left}
.favs li{font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:20rem}
.favs b{display:inline-block;width:1.7rem;height:1.7rem;line-height:1.7rem;text-align:center;margin-right:.7rem;border-radius:var(--radius-sm);border:1px solid var(--gas);color:var(--gas);font-size:.95rem}
.m-main{flex:1 1 auto;display:flex;align-items:center;min-height:0;padding:0 1rem}
.m-cover{flex:none;width:26rem;height:26rem;margin-right:2.6rem;border-radius:var(--radius);overflow:hidden;background:var(--card);box-shadow:0 1.6rem 4rem rgba(0,0,0,.65),0 0 0 1px var(--line);transition:width .6s,height .6s}
.m-cover img{display:block;width:100%;height:100%;object-fit:cover}
.view-lyrics .m-cover,.view-notes .m-cover{width:13rem;height:13rem}
.m-info{flex:1 1 auto;min-width:0}
.m-where{display:flex;align-items:center}
.m-where .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstate{flex:none;display:inline-flex;align-items:flex-end;height:1rem;width:1.3rem;margin-right:.7rem}
.mstate i{display:block;width:.26rem;height:100%;margin-right:.13rem;background:var(--gas);border-radius:1px;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}
.mstate i:nth-child(2){animation-delay:-.4s} .mstate i:nth-child(3){animation-delay:-.75s}
.mstate.off i{animation:none;transform:scaleY(.3);background:var(--muted)}
.lite .mstate i{animation:none;transform:scaleY(.7)}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.m-title{font:700 2.3rem/1.15 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:.55rem 0 .35rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word}
.m-artist{font-size:1.3rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-prog{margin-top:1.3rem;max-width:40rem}
.m-rail{height:.3rem;border-radius:.15rem;background:rgba(233,236,255,.14);overflow:hidden}
.m-rail i{display:block;height:100%;width:0;background:var(--gas);box-shadow:0 0 .8rem rgba(79,214,255,.7)}
.m-times{display:flex;justify-content:space-between;font-size:.95rem;color:var(--muted);margin-top:.4rem}
.m-lyrics{margin-top:1.4rem;min-height:7.2rem}
.m-lyrics p{font:700 1.55rem/1.45 var(--f-body);color:rgba(233,236,255,.3);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .4s}
.m-lyrics p.now{color:var(--ink);text-shadow:0 0 1.2rem rgba(79,214,255,.35)}
.m-lyrics p.done{color:rgba(233,236,255,.22)}
.m-lyrics p.note{font:400 1.05rem/1.5 var(--f-body);color:var(--muted);white-space:normal}
.view-lyrics .m-lyrics{margin-top:1rem}
.view-lyrics .m-lyrics p{font-size:1.9rem;white-space:normal}
.view-lyrics .m-title{font-size:1.6rem;-webkit-line-clamp:1}
.view-lyrics .m-artist{font-size:1.1rem}
.view-lyrics .m-prog,.view-notes .m-prog,.view-lyrics .m-next,.view-notes .m-next{display:none}
.note-page{margin:0}
.note-page img{display:block;max-width:100%;height:20rem;max-height:52vh;border-radius:var(--radius-sm);box-shadow:0 1rem 3rem rgba(0,0,0,.6);background:var(--card)}
.note-page .label{margin-top:.6rem}
.m-next{margin-top:1rem;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-next .label{margin-right:.5rem}
/* the house queue (tvqueue.js): the next few, who chose them and their votes; and the party's code to scan */
.m-next p.label{margin:0}
.hq{list-style:none;margin:.3rem 0 0;padding:0;counter-reset:hq}
.hq li{display:flex;align-items:baseline;padding:.14rem 0;counter-increment:hq}
.hq li::before{content:counter(hq);-webkit-box-flex:0;flex:none;width:1.6rem;font:500 .95rem var(--f-mono);color:var(--gas)}
.hq .t{-webkit-box-flex:1;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hq .by,.hq .votes{flex:none;white-space:nowrap}
.hq b{font-weight:600}
.hq .by{margin-left:.7rem;font:500 .9rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--neg)}
.hq .votes{margin-left:.7rem;font:500 .95rem/1 var(--f-mono);color:var(--cal)}
.m-party{width:19rem;text-align:center;background:var(--card);border:1px solid var(--line-hot);border-radius:var(--radius);padding:1rem 1.1rem 1.1rem;box-shadow:0 0 2.4rem -.6rem rgba(184,146,255,.45)}
#mParty{position:absolute;right:.5rem;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%)}
.pqr{width:13rem;height:13rem;margin:.7rem auto .5rem;border-radius:var(--radius-sm);overflow:hidden}
.pqr svg{display:block;width:100%;height:100%}
.pcode{font-size:1.5rem;letter-spacing:.14em;color:var(--gas)}
.m-party .note{margin-top:.35rem;font-size:.95rem;line-height:1.4}
.party-on .m-main{padding-right:21rem}
.party-on .m-cover{width:19rem;height:19rem;margin-right:2rem}
.music-mode > .m-empty.with-party{display:flex;align-items:center;max-width:none;width:100%}
.m-empty.with-party .m-idle{flex:1 1 auto;min-width:0;padding-right:3rem}
.m-empty.with-party .m-party{flex:none;text-align:center}
.m-idle .m-next{margin:1.4rem auto 0;display:inline-block;text-align:left;max-width:100%}
/* Today: what's playing, under the date */
.date + .np{margin-top:.35rem;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34rem}
.np:empty{display:none}
.np .np-ic{color:var(--gas);margin-right:.45rem}
.np b{font-weight:600}
@keyframes drift-sm{0%{transform:translate(-3vw,-1vh)}33%{transform:translate(2.5vw,1vh)}66%{transform:translate(-2vw,1.5vh)}100%{transform:translate(3vw,-.5vh)}}
@keyframes drift{0%{transform:translate(-6vw,-4vh)}25%{transform:translate(5vw,-2vh)}50%{transform:translate(4vw,5vh)}75%{transform:translate(-5vw,3vh)}100%{transform:translate(6vw,-3vh)}}

/* settings */
.sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(4,5,13,.96);overflow-y:auto;padding:var(--edge-y) var(--edge-x)}
.sheet form{max-width:62rem;margin:0 auto}
.sheet-head h2{font:700 1.3rem/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.4rem}
.sheet .card{margin-top:.8rem}
.fields{display:flex;flex-wrap:wrap;margin:0 -.5rem}
.field{margin:.4rem .5rem;flex:1 1 13rem;min-width:0}
.field.solo{flex:0 1 26rem}
.field.wide{flex-basis:30rem}
.field label{display:block;font-size:.9rem;font-weight:600;color:var(--muted);margin-bottom:.3rem}
.field input,.field select{font:1rem/1.25 var(--f-body);color:var(--ink);background:var(--card-2);border:2px solid var(--line-hot);border-radius:var(--radius-sm);padding:.5em .6em;width:100%}
.help{font-size:.9rem;color:var(--muted);margin:.3rem 0;max-width:62ch}
.pair{font-size:1.1rem}
.pair .code{font:700 1.8rem/1 var(--f-mono);letter-spacing:.18em;color:var(--gas);margin-left:.6rem}
.actions{margin-top:1rem}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(var(--edge-y) + 1rem);transform:translateX(-50%);background:var(--card);border:1px solid var(--gas);border-radius:var(--radius-sm);padding:.7rem 1rem;font:500 1rem/1.3 var(--f-body);max-width:90vw;text-align:center}

/* guest Wi-Fi: the code, big, in the middle of the screen */
.wifi-card{position:fixed;top:0;left:0;right:0;bottom:0;z-index:35;background:rgba(4,5,13,.88);display:flex;align-items:center;justify-content:center;padding:var(--edge-y) var(--edge-x)}
.wifi-card .card{text-align:center;padding:1.2rem 2rem;max-width:90vw}
.wifi-card .qr{width:15rem;height:15rem;margin:.6rem auto;max-width:70vw;max-height:70vw}
.wifi-card .qr svg{display:block;width:100%;height:100%;border-radius:var(--radius-sm)}
.wifi-card .net{font:600 1.5rem/1.3 var(--f-body);margin-top:.4rem}
.wifi-card .pw{font-size:1.3rem;color:var(--gas);margin-top:.2rem;word-break:break-all}

/* embedded in the phone's Screen page: just the picture */
body.embed .bar,body.embed .toast{display:none!important}

@media (max-width:699px){
  .board,.board.wide{width:80vw}
  .board .bb{font-size:2rem}
  .hud{left:6%;right:6%;bottom:4%;grid-template-columns:1fr auto 1fr}
  .hud .inst{display:none}
  .hud .v{font-size:1.5rem}
  .hud .hclock{font-size:2.3rem}
  .bar{display:block;padding-bottom:.4rem}
  .picker,.bar-actions{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .bar-actions::-webkit-scrollbar{display:none}
  .verdict{margin:.6rem 0;flex-basis:100%;order:3}
  .when .clock{font-size:3rem}
  .price{font-size:3.2rem}
  .price-now{text-align:left;margin-top:.6rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
