name: Check and publish

# Every push and pull request is checked. Pushes to main are also published to GitHub Pages,
# locked with the SITE_PASSWORD secret when it's set (see README, "Publishing").
on:
  push:
  pull_request:
  workflow_dispatch:
  # Every Saturday morning, after Friday's collection: check the next bin dates with Stockport Council and republish.
  schedule:
    - cron: '17 4 * * 6'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: npm run ci (build, tests, phone and TV checks, lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (Playwright for the phone and TV checks)
        run: |
          npm ci --no-audit --no-fund
          if [ "${{ github.event_name }}" != "schedule" ]; then npx playwright install --with-deps chromium; fi
      - name: Everything a contributor runs (npm run ci, which builds the display and the dashboard)
        if: github.event_name != 'schedule'
        run: npm run ci
      - name: Build (the Saturday bin run skips the checks)
        if: github.event_name == 'schedule'
        run: npm run build
      - name: Build the published folder
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: lock/publish.sh _site
      - name: Next bin collections from Stockport Council
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          STOCKPORT_UPRN: ${{ secrets.STOCKPORT_UPRN }}
        run: node scripts/bins.mjs _site/bins.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
