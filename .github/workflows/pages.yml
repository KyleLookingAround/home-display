name: Check and publish

# Every push and pull request is checked. Pushes to main are also published to GitHub Pages,
# locked with the SITE_PASSWORD secret when it's set (see README, "Publishing").
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: npm run ci (build, tests, phone and TV checks, lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (Playwright for the phone and TV checks)
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Everything a contributor runs (npm run ci)
        run: npm run ci
      - name: Build the published folder
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: lock/publish.sh _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
