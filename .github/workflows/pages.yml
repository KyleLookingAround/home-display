name: Check and publish

# Every push and pull request is checked. Pushes to main are also published to GitHub Pages,
# locked with the SITE_PASSWORD secret when it's set (see README, "Publishing").
# The redesign branch, while it exists, is published alongside at /preview/: a push to it, once checked,
# asks for a fresh run on main, which builds both (only main may deploy to Pages).
on:
  push:
  pull_request:
  workflow_dispatch:
  # Every Saturday morning, after Friday's collection: check the next bin dates with Stockport Council and republish.
  schedule:
    - cron: '17 4 * * 6'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: npm run ci (build, tests, phone and TV checks, lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (Playwright for the phone and TV checks)
        run: |
          npm ci --no-audit --no-fund
          if [ "${{ github.event_name }}" != "schedule" ]; then npx playwright install --with-deps chromium; fi
      - name: Everything a contributor runs (npm run ci, which builds the display and the dashboard)
        if: github.event_name != 'schedule'
        run: npm run ci
      - name: Build (the Saturday bin run skips the checks)
        if: github.event_name == 'schedule'
        run: npm run build
      - name: Build the published folder
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: lock/publish.sh _site
      - name: Preview the redesign branch at /preview/
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if git ls-remote --exit-code --heads origin redesign >/dev/null; then
            git fetch --depth 1 origin redesign
            git worktree add /tmp/redesign FETCH_HEAD
            (cd /tmp/redesign && npm ci --no-audit --no-fund && lock/publish.sh /tmp/redesign-site)
            mkdir -p _site/preview && cp -R /tmp/redesign-site/. _site/preview/
            echo "The redesign branch is previewed at /preview/."
          fi
      - name: Next bin collections from Stockport Council
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          STOCKPORT_UPRN: ${{ secrets.STOCKPORT_UPRN }}
        run: |
          node scripts/bins.mjs _site/bins.json
          if [ -d _site/preview ] && [ -f _site/bins.json ]; then cp _site/bins.json _site/preview/; fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  preview:
    name: Ask main to republish with the redesign preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/redesign'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
